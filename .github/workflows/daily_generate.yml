name: Generate Daily Japanese Words

on:
  schedule:
    # 每天台灣時間早上 6:00 自動執行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 支援在 GitHub 上手動按按鈕立即觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Words with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate.js

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add today.json
          git commit -m "Auto-update daily words [skip ci]" || exit 0
          git push
